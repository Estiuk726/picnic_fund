<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<title>Picnic Fund Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --leaf: #2F5D3A; --leaf-lt: #E5EFE2; --leaf-mid: #9CC29A;
    --turmeric: #E2A72E; --turmeric-lt: #FBEFD3;
    --chili: #C8462E; --chili-lt: #F8E1DB;
    --paper: #F7F9F5; --card: #FFFFFF; --ink: #1E2A22; --muted: #66746A; --line: #E1E7DF;
    --r-md: 12px; --r-sm: 999px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hind Siliguri", system-ui, sans-serif; background: var(--paper); color: var(--ink);
         font-size: 16px; line-height: 1.4; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }
  .top { background: var(--leaf); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 0 22px; }
  .brand { font-weight: 700; font-size: 18px; }
  .brand small { font-weight: 500; opacity: .75; font-size: .75em; }
  .fund { margin-top: 14px; }
  .fund span { font-size: 14px; opacity: .85; }
  .fund b { display: block; font-size: 40px; line-height: 1.1; }
  .month { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 6px; }
  .month button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-size: 22px; line-height: 1; color: var(--leaf); }
  .month button:disabled { opacity: .35; }
  .month-name { font-size: 24px; font-weight: 700; text-align: center; line-height: 1.1; }
  .month-sub { font-size: 14px; color: var(--muted); text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 30px; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.ok { border-color: var(--leaf-mid); } .stat.ok b { color: var(--leaf); }
  .stat.part b { color: #8A5F00; }
  .stat.no b { color: var(--chili); }
  .bar-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 16px; }
  .bar-line b { color: var(--ink); }
  .bar { height: 10px; background: var(--line); border-radius: var(--r-sm); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--turmeric); border-radius: var(--r-sm); transition: width .6s ease; }
  h2 { font-size: 18px; margin: 24px 2px 10px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--muted); font-size: 13px; }
  .pill { font-size: 13px; font-weight: 600; border-radius: var(--r-sm); padding: 2px 11px; white-space: nowrap; }
  .pill.ok { background: var(--leaf-lt); color: var(--leaf); }
  .pill.part { background: var(--turmeric-lt); color: #8A5F00; }
  .pill.no { background: var(--chili-lt); color: var(--chili); }
  .pill.wait { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; }
  .note a { color: var(--leaf); }
  .msg { padding: 60px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Picnic Fund <small>Status</small></div>
    <div class="fund"><span>Total fund so far</span><b id="total">...</b></div>
  </div>
</header>

<div id="msg" class="msg">Loading...</div>

<main id="app" class="wrap hidden">
  <div class="month">
    <button id="prevM" aria-label="Previous month">&#8249;</button>
    <div><div class="month-name" id="mName"></div><div class="month-sub" id="mSub"></div></div>
    <button id="nextM" aria-label="Next month">&#8250;</button>
  </div>

  <div class="stats">
    <div class="stat ok"><b id="nPaid"></b><span>Paid</span></div>
    <div class="stat part"><b id="nPart"></b><span>Partly paid</span></div>
    <div class="stat no"><b id="nNot"></b><span>Not paid</span></div>
  </div>
  <div class="bar-line"><span>Collected this month</span><span><b id="mGot"></b> of <span id="mDue"></span></span></div>
  <div class="bar"><i id="mBar"></i></div>

  <h2>Families</h2>
  <div class="list" id="list"></div>

  <p class="note">Updates as soon as a payment is recorded. <a href="./">Cashier or admin login</a></p>
</main>

<script>
  var API = 'https://lmvcjdqdbtczqkunuvuv.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_kyg2uy9TmKa2BzTNLhRPRw_BcsPgJT9';
  var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var D = null, mi = 0;
  var $ = function (id) { return document.getElementById(id); };
  function tk(n) { return '৳' + Number(n).toLocaleString('en-US'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mLong(s) { var p = s.split('-'); return MN[Number(p[1]) - 1] + ' ' + p[0]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function people(n) { return n + (n === 1 ? ' person' : ' people'); }

  function render() {
    var m = D.months[mi], overdue = today() > m.slice(0, 8) + pad(D.deadline);
    var future = today() < m;
    $('mName').textContent = mLong(m);
    $('mSub').textContent = future ? 'Not started yet' : overdue ? 'Deadline was the ' + D.deadline + 'th' : 'Due by the ' + D.deadline + 'th';
    $('prevM').disabled = mi === 0; $('nextM').disabled = mi === D.months.length - 1;
    var paid = 0, part = 0, not = 0, got = 0, due = 0, rows = [];
    D.families.forEach(function (f) {
      var d = f.members * D.rate, p = Number(f.paid[m] || 0), st, cls;
      got += p; due += d;
      if (p >= d) { paid++; st = 'Paid'; cls = 'ok'; }
      else if (p > 0) { part++; st = 'Partly paid'; cls = 'part'; }
      else { not++; st = overdue ? 'Not paid' : 'Not yet'; cls = overdue ? 'no' : 'wait'; }
      rows.push({ f: f, st: st, cls: cls, order: { ok: 2, part: 1, no: 0, wait: 0 }[cls] });
    });
    rows.sort(function (a, b) { return a.order - b.order; });
    $('nPaid').textContent = paid; $('nPart').textContent = part; $('nNot').textContent = not;
    $('mGot').textContent = tk(got); $('mDue').textContent = tk(due);
    $('mBar').style.width = (due ? Math.min(100, got / due * 100) : 0) + '%';
    $('list').innerHTML = rows.map(function (r) {
      return '<div class="row"><div>' + esc(r.f.name) + '<small>' + people(r.f.members) + '</small></div><span class="pill ' + r.cls + '">' + r.st + '</span></div>';
    }).join('');
  }

  function load() {
    fetch(API + 'pf_public', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: '{}' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        var first = !D; D = d;
        if (first) {
          var t = today().slice(0, 8) + '01', i = d.months.indexOf(t);
          mi = i >= 0 ? i : (t < d.months[0] ? 0 : d.months.length - 1);
        }
        $('total').textContent = tk(d.total);
        $('msg').classList.add('hidden'); $('app').classList.remove('hidden');
        render();
      })
      .catch(function () { if (!D) $('msg').textContent = 'Could not load. Check the internet and refresh.'; });
  }
  $('prevM').onclick = function () { if (mi > 0) { mi--; render(); } };
  $('nextM').onclick = function () { if (mi < D.months.length - 1) { mi++; render(); } };
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
